site_name: instantlyai
site_description: A typed Python client for the Instantly.ai V2 API
site_url: https://exprtec.github.io/instantlyai-python-sdk
repo_url: https://github.com/exprtec/instantlyai-python-sdk
repo_name: exprtec/instantlyai-python-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

nav:
  - Home: index.md
  - Tutorial:
      - Authenticate: tutorial/authenticate.md
      - Run a campaign: tutorial/run-a-campaign.md
      - Handle rate limits: tutorial/handle-rate-limits.md
      - Async usage: tutorial/async-usage.md
  - Reference:
      - Client: reference/client.md
      - Resources: reference/resources.md
      - Models: reference/models.md
      - Exceptions: reference/exceptions.md
      - Pagination: reference/pagination.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_bases: false
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/exprtec/instantlyai-python-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/instantlyai/
